<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vineet's Creative Project | P5.js</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="A collection of interactive creative coding projects built with P5.js">
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <header class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Creative Projects</h1>
        <p class="hero-subtitle">Exploring computational art, interactive experiences, and data visualization with P5.js</p>
        <div class="hero-stats">
          <span class="stat"><strong id="project-count">0</strong> Projects</span>
          <span class="stat"><strong>JavaScript</strong></span>
          <span class="stat"><strong>P5.js</strong></span>
        </div>
        <a href="https://github.com/vineet-00/p5" target="_blank" class="github-link" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          View on GitHub
        </a>
      </div>
    </header>

    <!-- Filter Navigation -->
    <nav class="filter-nav" aria-label="Project filters">
      <button class="filter-btn active" data-filter="all">All Projects</button>
      <button class="filter-btn" data-filter="simulation">Simulations</button>
      <button class="filter-btn" data-filter="game">Games</button>
      <button class="filter-btn" data-filter="visualization">Visualizations</button>
      <button class="filter-btn" data-filter="generative-art">Generative Art</button>
      <button class="filter-btn" data-filter="analysis">Data Analysis</button>
    </nav>

    <!-- Projects Grid -->
    <main class="projects-grid" id="projects-grid" aria-live="polite"></main>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 Vineet's Creative Projects. Built with passion for computational art.</p>
      <p>All projects available on <a href="https://github.com/vineet-00/p5" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close project preview">&times;</button>
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <div class="modal-tags" id="modal-tags"></div>
      </div>
      <div class="modal-body">
        <iframe id="modal-iframe" src="" frameborder="0" title="Project preview"></iframe>
        <div class="modal-info">
          <p id="modal-description"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
