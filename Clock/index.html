<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arc Clock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Arc Clock</h1>
      <p class="desc">
        A colorful clock visualized using three arcs representing the hours, minutes, and seconds. Each arc grows and moves dynamically with the passage of time. The clock hands rotate along the arcs, creating a smooth and visually engaging time display.
      </p>
      <div id="canvas-container"></div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
