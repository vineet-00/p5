<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <link rel="stylesheet" href="style.css" />
    <meta charset="utf-8" />
    <title>Jackson Mac Low Diastic Machine</title>
  </head>
  <body>
    <main>
      <h1>Jackson Mac Low Diastic Machine</h1>
      <p class="desc">
        This project implements the Diastic Machine, a poetic method that generates phrases by selecting words from a source text matching seed letters in positions. Upload your own text file or use the default to generate custom phrases.
      </p>
      <p>
        Upload text file: <input type="file" id="fileUpload" accept=".txt" />
      </p>
      <p>
        Seed word:
        <input type="text" id="seed" placeholder="Enter seed word" />
        <button id="submit">Generate Phrase</button>
      </p>
      <div id="output"></div>
    </main>
    <script src="diastic.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
