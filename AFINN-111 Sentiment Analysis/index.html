<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <link rel="stylesheet" href="style.css" />
    <meta charset="utf-8" />
    <title>AFINN Sentiment Demo</title>
  </head>
  <body>
    <main>
      <h1>AFINN Sentiment Demo</h1>
      <div id="sentiment-container">
        <label for="txt">Type your text below:</label>
        <textarea id="txt" cols="50" rows="6" placeholder="Enter a sentence for sentiment analysis"></textarea>
        <div id="output">
          <p id="scoreP"></p>
          <p id="comparativeP"></p>
          <div id="indicator"></div>
          <p id="wordlistP"></p>
        </div>
      </div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
